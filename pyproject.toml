[project]
name = "ledgerlens"
version = "0.1.0"
description = "Self-hostable multi-agent financial analysis platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# Version floors only; exact pins are fixed by research task T-002 (CONTRACTS.md §1).
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "adapters",
    "common",
    "eval",
    "ingestion",
    "model_router",
    "orchestrator",
    "rag",
    "tools",
    "workers",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ['^\.venv/', '^data/', '^web/']

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: integration tests against live services (excluded from the default unit run)",
]
