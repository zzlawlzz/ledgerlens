# LedgerLens base compose. Services are added by their backlog tasks
# (T-005 postgres; T-015 app; T-017 ollama; T-018 qdrant; ...).
services:
  app:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      WORKER_URL: http://worker:8081
    volumes:
      # Model cache lives on the project drive; the container must not
      # re-download ~3.5GB of ONNX models (blocked/slow network from RU).
      - ./data/cache/fastembed:/app/data/cache/fastembed
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request, sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz',
          timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Local CPU inference (T-017). Profile "local": `docker compose --profile local up`.
  # Machines without resources run the no-local mode: plain `docker compose up`
  # + empty LOCAL_MODEL in .env (the router drops the local tier with a warning).
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    environment:
      OLLAMA_KEEP_ALIVE: -1   # never unload: cold CPU load takes minutes (T-017)
      OLLAMA_NUM_PARALLEL: 2  # two concurrent requests before queueing (dev box)
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["local"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LOCAL_MODEL: ${LOCAL_MODEL:-qwen3.5:27b}
    volumes:
      - ./scripts/ollama_pull.sh:/ollama_pull.sh:ro
    entrypoint: ["/bin/sh", "/ollama_pull.sh"]
    restart: "no"

  # Web UI (T-024): nginx static + /api,/agui proxy to the app.
  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 and
      # nginx listens on IPv4 only.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Observability dashboards (T-034). Provisioning-as-code: the datasource and
  # dashboards are mounted from ./observability — no manual import, `make up`
  # brings Grafana up pre-wired. Host port 3001: 3000 is taken by the web UI.
  # Anonymous access is viewer-only (demo); admin login still works for edits.
  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Expanded by Grafana itself inside provisioning files
      # (observability/datasources/postgres.yaml) — secrets never live in git.
      POSTGRES_DB: ${POSTGRES_DB:-ledgerlens}
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD:-}
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/dashboards.yaml:/etc/grafana/provisioning/dashboards/ledgerlens.yaml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # busybox wget (Alpine image); 127.0.0.1 to avoid ::1 resolution issues.
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Monitoring layer B (T-035): n8n schedules the 8-K watch and calls the
  # orchestrator's /api/monitor/* endpoints. Opt-in — starts only with
  # `docker compose --profile monitoring up n8n`, so the core demo stack is
  # untouched (and the image isn't pulled) unless monitoring is explicitly on.
  n8n:
    image: n8nio/n8n:latest
    profiles: ["monitoring"]
    environment:
      # Persisted-credentials encryption; a stable key survives volume reuse.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      GENERIC_TIMEZONE: UTC
      # The workflow reads these to reach the orchestrator on the compose net.
      LEDGERLENS_API_URL: http://app:8000
      MONITOR_TOKEN: ${MONITOR_TOKEN:-}
      EDGAR_USER_AGENT: ${EDGAR_USER_AGENT:-}
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      # Workflow JSON is versioned in the repo; import it per monitoring/README.
      - ./monitoring/workflows:/workflows:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # MCP tool servers (T-027): the worker loads tools over MCP; behaviour is
  # identical to lib mode, only the transport changes.
  mcp-sql:
    build: .
    entrypoint: ["python", "-m", "tools.sql.server"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8765:8765"  # host access for dev tests / MCP inspector
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/mcp_ping.py", "http://127.0.0.1:8765/mcp"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  mcp-rag:
    build: .
    entrypoint: ["python", "-m", "tools.rag.server"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/cache/fastembed:/app/data/cache/fastembed
    ports:
      - "8766:8766"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/mcp_ping.py", "http://127.0.0.1:8766/mcp"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  mcp-enrich:
    build: .
    entrypoint: ["python", "-m", "tools.enrich.server"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8767:8767"  # host access for dev tests / MCP inspector
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/mcp_ping.py", "http://127.0.0.1:8767/mcp"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # ReAct worker as a separate A2A service (T-021): the orchestrator talks to
  # it only over the A2A protocol; a second node (T-031) is one more entry in
  # config/workers.yaml, no code changes.
  worker:
    build: .
    command:
      ["uvicorn", "workers.a2a_server:app", "--host", "0.0.0.0", "--port", "8081"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      WORKER_NODE_NAME: local
      WORKER_BASE_URL: http://worker:8081
      MCP_SQL_URL: http://mcp-sql:8765/mcp
      MCP_RAG_URL: http://mcp-rag:8766/mcp
      MCP_ENRICH_URL: http://mcp-enrich:8767/mcp
    ports:
      - "8081:8081"  # host access for dev tests (401/card checks)
    volumes:
      - ./data/cache/fastembed:/app/data/cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request, sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8081/healthz',
          timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerlens}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-ledgerlens}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  ollama-models:
  qdrant-data:
  grafana-data:
  n8n-data:
