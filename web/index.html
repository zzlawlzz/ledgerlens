<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Multi-agent financial analysis — plans, self-corrects, cites every claim." />
    <title>LedgerLens — Multi-agent financial analysis</title>
    <script>
      // Set the theme before first paint to avoid a flash (matches App's detectTheme).
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme =
            saved === "dark" || saved === "light"
              ? saved
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
