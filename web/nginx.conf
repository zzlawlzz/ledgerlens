server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
    }

    location /agui {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        # SSE: no buffering, long-lived
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /healthz {
        proxy_pass http://app:8000;
    }
}
