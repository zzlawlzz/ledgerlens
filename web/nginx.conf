# Security headers (T-036 §3): hardened surface for the public demo. Applied at
# server level; nginx does not inherit add_header into a location that defines
# its own, so the SSE /agui block below repeats the ones that matter for it.
server {
    listen 80;
    server_name _;

    # Don't advertise the nginx version in responses / error pages.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Demo questions are capped at 500 chars (T-036 §1); no upload surface. A
    # small body limit blunts accidental/abusive large POSTs before the app.
    client_max_body_size 64k;

    # --- Security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # The SPA and API are same-origin behind the tunnel. Vite emits external JS
    # modules and CSS; styles may be injected inline, so style-src allows inline.
    # connect-src 'self' covers fetch + the SSE stream on /agui.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
    }

    location /agui {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        # SSE: no buffering, long-lived
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
        # Re-declared: a location with its own add_header does not inherit the
        # server-level ones. Keep the framing/sniffing guards on the stream too.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /healthz {
        proxy_pass http://app:8000;
    }
}
