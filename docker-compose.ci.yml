# CI / eval overlay (T-030 / §3 эталонный full-eval).
#
# The base docker-compose.yml publishes the MCP servers on host ports
# 8765/8766/8767 purely "for dev tests / MCP inspector" — the app reaches them
# over the compose network by service name (MCP_SQL_URL=http://mcp-sql:8765/mcp
# etc.), so the published host ports are never used by the eval harness.
#
# On the self-hosted EPYC runner (Q-22=A) the eval stack is co-located with the
# always-on demo / distributed A2A stack, whose deploy/worker-node/compose.mcp-awg.yml
# binds the same MCP servers to the AmneziaWG tunnel address (10.9.0.1:8765/…).
# The eval stack's 0.0.0.0:8765 publish then collides with that binding
# ("Bind for 10.9.0.1:8765 failed: port is already allocated"), so `docker
# compose up` aborts before a single case is scored (run 29292555409). Dropping
# the eval stack's MCP host publishes removes the collision without touching the
# base file (dev keeps its inspector ports) or any internal wiring.
#
# `!override []` replaces (not appends to) the base `ports` list; requires
# Compose ≥ 2.24 (the runner is on v5.x).
services:
  mcp-sql:
    ports: !override []
  mcp-rag:
    ports: !override []
  mcp-enrich:
    ports: !override []
