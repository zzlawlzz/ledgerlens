# CI / eval overlay (T-030 / §3 эталонный full-eval).
#
# The eval stack runs on the self-hosted workstation runner — the same machine
# that hosts the always-on demo stack (this repo's compose project), which
# already holds host ports 8000 (app), 5432 (postgres), 6333 (qdrant),
# 8765-8768 (MCP servers, dev inspector), 8081 (worker A2A), 3000/3001
# (web/grafana). A second compose project publishing the same ports would abort
# `docker compose up` with "port is already allocated" before a single case is
# scored, so this overlay:
#
#   * shifts the ports the eval harness actually needs from the host
#     (app → 18000, qdrant → 16333; postgres is shifted to 15432 via
#     POSTGRES_PORT in the CI .env, the base file already parametrizes it);
#   * drops the publishes nothing in CI ever uses (MCP inspector ports,
#     worker A2A port) — the app reaches those services over the compose
#     network by service name (MCP_SQL_URL=http://mcp-sql:8765/mcp etc.).
#
# `!override []` replaces (not appends to) the base `ports` list; requires
# Compose ≥ 2.24.
services:
  app:
    ports: !override
      - "18000:8000"
  qdrant:
    ports: !override
      - "16333:6333"
  worker:
    ports: !override []
  mcp-sql:
    ports: !override []
  mcp-rag:
    ports: !override []
  mcp-enrich:
    ports: !override []
  mcp-websearch:
    ports: !override []
