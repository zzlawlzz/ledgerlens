# EPYC home-node overlay (T-036 §4 / T-031). The persistent demo runs on the
# same box as the GitHub Actions self-hosted eval runner (Q-22=A), which spins
# up its OWN copy of the stack on the default ports. To coexist, the demo must
# not fight for host ports or container names:
#
#   * Container names: bring the demo up under a distinct project name, e.g.
#     `docker compose -p lldemo -f docker-compose.yml \
#        -f deploy/demo/docker-compose.demo.yml -f deploy/demo/compose.epyc.yml up -d`
#     so its containers are `lldemo-*` while the eval's stay `ledgerlens-*`.
#   * Host ports: this overlay REMAPS the demo's published ports to a private
#     1xxxx range with the `!override` merge tag (which REPLACES the base port
#     list — `!reset` would only blank it and ignore the new value). They never
#     collide with the eval's defaults (5432/6333/8000/3000). The public entry
#     is the cloudflared tunnel -> web:80 on the internal network; the remapped
#     host ports exist only for on-node seeding and health checks. Services with
#     no host-side need drop their ports (`!override []`).
#
# Requires Docker Compose v2.24.4+ for the `!override` tag (v5.x on the node).
services:
  postgres:
    ports: !override
      - "15432:5432"
  qdrant:
    ports: !override
      - "16333:6333"
  app:
    ports: !override
      - "18000:8000"
  web:
    ports: !override
      - "18080:80"
  grafana:
    ports: !override []
  mcp-sql:
    ports: !override []
  mcp-rag:
    ports: !override []
  mcp-enrich:
    ports: !override []
  worker:
    ports: !override []
