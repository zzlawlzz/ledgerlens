# EPYC home-node overlay (T-036 §4 / T-031). The persistent demo runs on the
# same box as the GitHub Actions self-hosted eval runner (Q-22=A), which spins
# up its OWN copy of the stack on the default ports. To coexist, the demo must
# not fight for host ports or container names:
#
#   * Container names: bring the demo up under a distinct project name, e.g.
#     `docker compose -p lldemo -f docker-compose.yml \
#        -f deploy/demo/docker-compose.demo.yml -f deploy/demo/compose.epyc.yml up -d`
#     so its containers are `lldemo-*` while the eval's stay `ledgerlens-*`.
#   * Host ports: this overlay REMAPS the demo's published ports to a private
#     1xxxx range (compose merges lists, so `!reset` replaces the base port).
#     They never collide with the eval's defaults (5432/6333/8000/3000). The
#     public entry is the cloudflared tunnel -> web:80 on the internal network;
#     the remapped host ports exist only for on-node seeding and health checks.
#     Services with no host-side need drop their ports entirely.
#
# Requires Docker Compose v2.24+ for the `!reset` tag (v5.x on the node).
services:
  postgres:
    ports: !reset
      - "15432:5432"
  qdrant:
    ports: !reset
      - "16333:6333"
  app:
    ports: !reset
      - "18000:8000"
  web:
    ports: !reset
      - "18080:80"
  grafana:
    ports: !reset []
  mcp-sql:
    ports: !reset []
  mcp-rag:
    ports: !reset []
  mcp-enrich:
    ports: !reset []
  worker:
    ports: !reset []
