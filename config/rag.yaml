# RAG pipeline parameters (ARCHITECTURE.md §3.5; consumed by T-018/T-019).
chunking:
  chunk_size_tokens: 800
  overlap_tokens: 150

embedding:
  # ADR-6 amendment (T-018): bge-m3 is not in fastembed 0.8 — the closest
  # supported multilingual 1024d dense model is multilingual-e5-large
  # (query:/passage: prefixes are applied by fastembed's query/passage APIs).
  model: intfloat/multilingual-e5-large
  dim: 1024
  sparse_model: Qdrant/bm25   # fastembed sparse model for hybrid search

search:
  top_k: 5
  prefetch_limit: 20          # per-vector candidates before fusion (RRF)
  rerank:
    enabled: true
    # ADR-6 amendment (T-018): bge-reranker-v2-m3 not in fastembed 0.8;
    # jina-reranker-v2 is the supported multilingual cross-encoder.
    model: jinaai/jina-reranker-v2-base-multilingual
  # Relevance floor after rerank -> no_results=true (anti-hallucination).
  # Placeholder value; calibrated on 5 positive / 5 negative queries in T-019 —
  # methodology and final value are documented here when T-019 lands.
  score_threshold: 0.3
