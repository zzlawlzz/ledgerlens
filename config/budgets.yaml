# Run budget profiles (CONTRACTS.md §13). Selected via BUDGET_PROFILE env.
# Budget overrun is not an error: orchestrator synthesizes a partial answer.
profiles:
  dev:
    max_plan_steps: 8
    max_replans: 2
    worker_max_iterations: 8
    # Per-worker-step wall deadline. 90 was the hardcoded WorkerBudget default;
    # a narrative_rag step (fastembed embed + hybrid search + jina cross-encoder
    # rerank + synthesis) is CPU-bound and on a slow eval runner (GitHub 2-vCPU)
    # did not finish under 90s, timing out before citations (T-041/Q-22). Three
    # full runs settled the value: at 120 a narrative case (tsla_risk, ~162s)
    # was killed mid-rag and lost its citations that 180 preserved, while the
    # guardrail 720s-cap hits proved to be nondeterministic runner starvation
    # (different cases each run) — NOT a deadline effect. So 180 is the better
    # deadline (max narrative completion); the case-cap flap is handled by a
    # larger CASE_TIMEOUT_S in eval/run.py, not by shrinking this.
    worker_deadline_s: 180
    max_cost_usd_per_run: 0.50
    max_tokens_per_run: 200000
    # 600 on the dev box: local-tier classify/extract on a laptop CPU eat
    # ~15-60s per call; the demo profile (home node, 2xEPYC) stays tight.
    wall_clock_s_per_run: 600
    runs_per_hour_per_ip: null   # unlimited in dev
  demo:
    # The public demo now runs on the workstation (migration 2026-07; the EPYC
    # node is retired). Its LLM tier is DeepSeek cloud and its RAG embeddings are
    # CPU-bound (fastembed) on this box — heavier and slower than the old 2xEPYC
    # home node, so a multi-company / 10-K-narrative query needs real head-room to
    # finish instead of tripping budget_exceeded mid-step. These limits are sized
    # for that, and are fully decoupled from the eval gate (eval runs under `dev`).
    max_plan_steps: 8
    max_replans: 2
    worker_max_iterations: 12
    # A narrative_rag step (fastembed embed + hybrid search + rerank + synthesis)
    # over a 10-K is CPU-bound here; 90s cut it off mid-retrieval. 240s lets it
    # complete. The frontend stall watchdog (120s between events) is unaffected —
    # the ReAct loop emits tool/thought events well inside that window.
    worker_deadline_s: 240
    max_cost_usd_per_run: 0.50
    max_tokens_per_run: 250000
    wall_clock_s_per_run: 600
    # Per-IP rate limiting needs a trustworthy client IP. Behind the old
    # Cloudflare tunnel that was CF-Connecting-IP; after the move to a DNS-only
    # VPS + SSH tunnel every request reaches the app from the tunnel's localhost,
    # so per-IP counting would collapse to a single shared bucket. Disabled here;
    # abuse is bounded by max_concurrent_runs + the daily DAILY_COST_CAP_USD cap.
    runs_per_hour_per_ip: null
    # Public-demo admission limits (T-036 §1, CONTRACTS §13). Enforced in-process
    # by orchestrator.demo_limits; the system-wide daily cost cap comes from
    # DAILY_COST_CAP_USD (env). Only active when BUDGET_PROFILE=demo.
    max_question_chars: 500
    max_concurrent_runs: 2

# Layer B (n8n monitoring, T-035) — independent of the per-run profiles above.
# Caps how many 8-K summaries the orchestrator will generate per day so a burst
# of filings (or a stuck n8n loop) cannot run up LLM cost. In-process counter.
layer_b:
  max_summaries_per_day: 50

# System-wide daily cost cap comes from env (DAILY_COST_CAP_USD, Q-07).
