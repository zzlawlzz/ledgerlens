# Run budget profiles (CONTRACTS.md §13). Selected via BUDGET_PROFILE env.
# Budget overrun is not an error: orchestrator synthesizes a partial answer.
profiles:
  dev:
    max_plan_steps: 8
    max_replans: 2
    worker_max_iterations: 8
    max_cost_usd_per_run: 0.50
    max_tokens_per_run: 200000
    wall_clock_s_per_run: 300
    runs_per_hour_per_ip: null   # unlimited in dev
  demo:
    max_plan_steps: 6
    max_replans: 1
    worker_max_iterations: 6
    max_cost_usd_per_run: 0.15
    max_tokens_per_run: 80000
    wall_clock_s_per_run: 180
    runs_per_hour_per_ip: 10

# System-wide daily cost cap comes from env (DAILY_COST_CAP_USD, Q-07).
