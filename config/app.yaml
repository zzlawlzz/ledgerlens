# Application mode and data sources (CONTRACTS.md §5; T-003).
mode: ${APP_MODE:us}          # us | ru

# Adapter registry: source name -> adapter implementation (resolved in T-007).
adapters:
  us: edgar
  ru: moex

# Default demo watchlist (Q-09: owner default, finalize before T-028).
watchlist:
  us: [AAPL, MSFT, NVDA, GOOGL, AMZN, META, TSLA, JPM, JNJ, WMT]  # XOM dropped: 2026 holding-company reorg left its new CIK with no filing history
  ru: [SBER, GAZP, LKOH]

# Example questions for the UI (T-024; both locales — Q-04). Kinds cover the
# demo scenarios: sql, rag, multi-step, self-correction trigger (T-025).
examples:
  - kind: sql
    en: "What was Apple's revenue in fiscal year 2025?"
    ru: "Какая выручка была у Apple в 2025 финансовом году?"
  - kind: rag
    en: "What are the main supply chain risks Apple discloses in its 10-K?"
    ru: "Какие основные риски цепочки поставок Apple раскрывает в 10-K?"
  - kind: multi_step
    en: "Compare the revenue dynamics of Apple and Microsoft over the last 3 fiscal years and name Apple's main risks."
    ru: "Сравни динамику выручки Apple и Microsoft за 3 года и назови главные риски Apple."
  - kind: multi_step
    en: "Which of NVIDIA and AMD grew revenue faster over the last two fiscal years?"
    ru: "Кто из NVIDIA и AMD быстрее наращивал выручку за последние два финансовых года?"
  # The household word "profit" is not a canonical metric name — the agent's
  # first query fails with a teaching hint and it self-corrects (T-025).
  - kind: self_correction
    en: "What was Apple's profit in fiscal year 2025?"
    ru: "Какая прибыль была у Apple в 2025 финансовом году?"
