# Non-advice guardrail regex patterns (T-022; CONTRACTS §12), RU + EN.
# Stage (a) of the two-stage check: cheap, deterministic, case-insensitive.
# Patterns aim at ADVICE (imperatives/recommendations), not at analytical
# mentions of the words — "выручка выросла" or "the company sells devices"
# must NOT trigger. Tuned against the test suite in tests/unit/test_guardrail.py.
patterns:
  # --- RU: buy/sell/hold imperatives and recommendations ---
  - '(?i)\b(вам|тебе)?\s*(стоит|следует|рекоменду(ю|ем|ется))\s+(купить|покупать|продать|продавать|держать|докупить|шортить)'
  - '(?i)\b(купите|покупайте|продайте|продавайте|держите|докупите|шортите)\b'
  - '(?i)\bсовету(ю|ем)\s+(купить|покупать|продать|продавать|держать)'
  - '(?i)\b(лучше|пора|время)\s+(купить|покупать|продать|продавать|зафиксировать\s+прибыль)'
  - '(?i)\bстоит\s+(войти|инвестировать|вложить(ся)?|добавить\s+в\s+портфель)'
  - '(?i)\b(целевая\s+цена|таргет)\b'
  - '(?i)\bдержать\s+до\s+(цели|таргета|\d)'
  - '(?i)\b(выделите|выделить|разместите)\s+\d+\s*%\s+(портфеля|капитала)'
  # --- EN: buy/sell/hold imperatives and recommendations ---
  - '(?i)\b(you\s+should|i\s+(would\s+)?recommend(\s+to)?|it\s+is\s+advisable\s+to)\s+(buy|sell|hold|short|accumulate)'
  - '(?i)\b(buy|sell|hold|short)\s+(the\s+)?(stock|shares?|it)\b'
  - '(?i)\b(strong\s+)?(buy|sell|hold)\s+rating\b'
  - '(?i)\bprice\s+target\b'
  - '(?i)\b(good|great|right)\s+time\s+to\s+(buy|sell|enter|exit)'
  - '(?i)\ballocate\s+\d+\s*%\s+of\s+(your\s+)?(portfolio|capital)'
  - '(?i)\b(go\s+long|go\s+short)\b'

# Input-side advice-SEEKING QUESTIONS (T-022 addendum). Matched against the
# user's question at intake to short-circuit to a non-advice reply BEFORE an
# expensive, doomed research plan runs (an open-ended "what should I buy to get
# rich" has no analyzable target). Deliberately narrow: only OPEN-ENDED advice
# ("what/where to invest", "which stocks to buy", "how to get rich"). Advice
# about a NAMED company ("should I sell NVDA?", "good time to buy Tesla?") is
# left to the normal pipeline, which answers with that company's facts + the
# non-advice refusal. Analytical questions (revenue, risks, comparisons) must
# NOT match — covered by tests/unit/test_guardrail.py.
question_patterns:
  # --- RU ---
  - '(?i)\bво\s+что\s+(вложи|вкладыва|инвестир)'
  - '(?i)\bкуда\s+(вложи|инвестир|вклад)'
  - '(?i)\bкак(ие|ую)?\s+(акци|бумаг|актив|фонд)\w*\s+.{0,20}?(купить|покупать|брать|выбрать)'
  - '(?i)\bчто\s+(мне\s+)?(купить|покупать)\b.{0,25}(бирж|акци|портфел|инвестир|деньг)'
  - '(?i)(разбогатеть|стать\s+богат|сколотить\s+состоян|как\s+заработать\s+на\s+(бирж|акци|инвест))'
  - '(?i)\b(посоветуй|подскажи|порекоменду)\w*.{0,30}(вложи|инвестир|акци|портфел|бумаг|купить)'
  # --- EN ---
  - '(?i)\bwhat\s+(should\s+i|to|can\s+i)\s+(buy|invest\s+in|pick)\b'
  - '(?i)\bwhich\s+(stocks?|shares?|companies|assets?|funds?)\s+(should\s+i\s+|to\s+|do\s+i\s+)?(buy|invest|pick|choose)'
  - '(?i)\bwhere\s+(should\s+i|to|do\s+i)\s+invest'
  - '(?i)\bhow\s+(to|do\s+i|can\s+i)\s+(get|become)\s+rich'
  - '(?i)\bhow\s+to\s+make\s+money\s+(on|in|with|from)\s+(the\s+)?(stock|market|invest|share)'
  - '(?i)\binvest\s+in\s+to\s+(get|become)\s+rich'
