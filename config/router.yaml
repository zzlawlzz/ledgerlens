# Model Router tiers and per-task-class policy (CONTRACTS.md §11).
# Model pins: T-002 (2026-07-10). deepseek-chat/reasoner are deprecated 2026-07-24 — do not use.
tiers:
  local:
    provider: ollama
    model: "${LOCAL_MODEL}"
    # 25s: a warm small model answers cheap classes in 5-15s; under queue
    # pressure we'd rather fall back to cloud fast than burn 2x60s per call
    # (observed on the dev box). Revisit with the T-037 benchmark.
    timeout_s: 25
  cloud_cheap:
    provider: deepseek
    model: deepseek-v4-flash
    thinking: disabled
    timeout_s: 60
  cloud_strong:
    provider: deepseek
    model: deepseek-v4-pro
    thinking: enabled
    timeout_s: 120

# Order = primary -> fallback chain. Tiers with a missing API key are dropped at startup.
policy:
  route: [local, cloud_cheap]
  extract: [local, cloud_cheap]
  guard: [local, cloud_cheap]
  summarize_event: [cloud_cheap, local]
  plan: [cloud_strong, cloud_cheap]
  reason: [cloud_cheap, cloud_strong]
  synthesize: [cloud_strong, cloud_cheap]
  judge: [cloud_strong]
  # T-041: post-answer grounding rewrite for narrative worker answers —
  # verifying claims against raw retrieved chunks, same quality bar as reason.
  ground_check: [cloud_cheap, cloud_strong]
  # T-043: web_search DeepSeek fallback (used only when the scraper finds nothing).
  web_search: [cloud_cheap, cloud_strong]

retries:
  attempts: 2
  backoff: exponential
