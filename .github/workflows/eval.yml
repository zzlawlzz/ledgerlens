# Eval-in-CI (T-030): runs eval.run --profile ci against the frozen demo
# corpus restored from an eval-snapshot artifact (see eval-snapshot.yml) —
# never touches EDGAR. Triggers: manual dispatch, nightly schedule (updates
# the main-branch baseline), and PRs labeled `eval` (compared against that
# baseline; see eval/README.md "Eval in CI").
name: eval

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eval profile (ci = 10 balanced cases; full = all 41)"
        type: choice
        options: [ci, full]
        default: ci
  # Nightly schedule is PAUSED until the workstation runner (labels:
  # self-hosted, ledgerlens-workstation) is registered — the previous EPYC
  # runner is decommissioned, and an un-servable schedule would just queue and
  # fail every day. Re-enable once the runner is online:
  # schedule:
  #   - cron: "30 3 * * *"   # nightly
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  eval:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'eval')
    # Self-hosted runner on the project workstation (the same machine that
    # hosts the demo stack; the former EPYC node is decommissioned). Rationale
    # for self-hosted (Q-22=A) unchanged: the free GitHub runner has 2 vCPUs,
    # on which the CPU-heavy jina cross-encoder rerank inside mcp-rag could
    # not finish within the worker deadline for every narrative case, so
    # citation_coverage capped below the strict 1.0 gate on a corpus that
    # scores 1.0 locally. Requires the runner service (labels: self-hosted,
    # ledgerlens-workstation) to be online.
    runs-on: [self-hosted, ledgerlens-workstation]
    defaults:
      run:
        # Explicit bash so the job works whether the workstation runner is
        # registered under WSL (Linux) or natively on Windows (Git Bash).
        shell: bash
    env:
      # Self-hosted runner: the HF Xet download accelerator writes to
      # ~/.cache/huggingface/xet, which failed with a permission error on the
      # persistent runner home. Disable it.
      HF_HUB_DISABLE_XET: "1"
      # The workstation sits behind an RU uplink where the HuggingFace CDN
      # (model blobs) is unreachable — the API resolves but downloads hang. So
      # run fully offline against the fastembed models already provisioned on
      # the runner (see "Link persistent fastembed models" below).
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/" .env
          sed -i "s/^POSTGRES_RO_PASSWORD=.*/POSTGRES_RO_PASSWORD=ci-ro-password/" .env
          sed -i "s/^GRAFANA_RO_PASSWORD=.*/GRAFANA_RO_PASSWORD=ci-grafana-ro-password/" .env
          sed -i "s/^DEEPSEEK_API_KEY=.*/DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}/" .env
          sed -i "s/^LOCAL_MODEL=.*/LOCAL_MODEL=/" .env
          sed -i "s/^A2A_TOKEN=.*/A2A_TOKEN=ci-a2a-token/" .env
          # Host ports shifted so the eval stack coexists with the always-on
          # demo stack on the workstation (see docker-compose.ci.yml).
          sed -i "s/^POSTGRES_PORT=.*/POSTGRES_PORT=15432/" .env

      # Self-hosted (RU uplink): the HF CDN is unreachable, so the ~3.5GB
      # fastembed models can't be downloaded here. Reuse the models already
      # provisioned on the runner (the demo stack's cache) by linking them
      # into the workspace — actions/checkout's clean wiped the previous run's
      # copy, and the source lives outside the workspace so it survives.
      # LEDGERLENS_FASTEMBED_CACHE is a runner-level env var pointing at that
      # persistent cache (on the workstation: the repo checkout's
      # data/cache/fastembed). On Windows/Git Bash `ln -s` silently degrades
      # to a copy, which is equally fine for the bind mount.
      - name: Link persistent fastembed models
        run: |
          src="${LEDGERLENS_FASTEMBED_CACHE:-$HOME/ledgerlens-demo/data/cache/fastembed}"
          if [ ! -d "$src" ]; then
            echo "::error::fastembed cache not found at $src — set LEDGERLENS_FASTEMBED_CACHE in the runner's env to a populated cache dir (HF CDN is unreachable from this uplink, models cannot be downloaded on the fly)."
            exit 1
          fi
          mkdir -p data/cache
          rm -rf data/cache/fastembed
          ln -sfn "$src" data/cache/fastembed
          echo "linked from $src; models:"; ls "$src" | head

      - name: Warm up embedding/reranker models
        run: |
          uv run python -c "
          from rag.embedding import ChunkEmbedder
          e = ChunkEmbedder()
          e.embed_dense(['warmup'], kind='query')
          e.embed_sparse(['warmup'])
          e.rerank('warmup', ['warmup'])
          print('fastembed models warmed up')
          "

      # Demo-corpus fixture, restored once, never regenerated from EDGAR here.
      - name: Download demo snapshot
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: eval-snapshot.yml
          name: eval-demo-snapshot
          path: snapshot/eval_demo
          workflow_conclusion: success
          if_no_artifact_found: fail

      # -f docker-compose.ci.yml shifts/drops the host-port publishes so the
      # eval stack can coexist with the always-on demo stack on the
      # workstation runner (which holds 8000/5432/6333/8765-8768/8081).
      # Without it, `up` aborts with "port is already allocated" before scoring.
      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d postgres qdrant --wait
      - name: Migrate schema
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "15432"
          POSTGRES_PASSWORD: ci-password
          POSTGRES_RO_PASSWORD: ci-ro-password
          GRAFANA_RO_PASSWORD: ci-grafana-ro-password
        run: uv run alembic upgrade head
      - name: Restore demo snapshot
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "15432"
          POSTGRES_PASSWORD: ci-password
        run: uv run python scripts/eval_snapshot.py restore --dir snapshot/eval_demo --qdrant-url http://localhost:16333

      # No `ollama` profile (T-017/T-018 no-local mode) + empty LOCAL_MODEL
      # above: the router drops the local tier at startup, cloud-only routing.
      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait app worker mcp-sql mcp-rag

      - name: Run eval
        id: eval_run
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "15432"
          POSTGRES_PASSWORD: ci-password
          POSTGRES_RO_PASSWORD: ci-ro-password
          # Manual dispatch may pick 'full'; nightly/PR default to 'ci'.
          EVAL_PROFILE: ${{ github.event.inputs.profile || 'ci' }}
        run: |
          set +e
          # --concurrency 1: kept for deterministic, low-variance scoring
          # (self-hosted citation=1.0 was confirmed on runs 29378924962 /
          # 29390701909; concurrency can be bumped for speed if desired).
          uv run python -m eval.run --profile "$EVAL_PROFILE" --base-url http://localhost:18000 --concurrency 1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Locate this run's report
        id: report
        run: |
          latest="$(ls -td eval/reports/*/ 2>/dev/null | head -1)"
          if [ -z "$latest" ]; then
            echo "::error::eval.run produced no report — it likely crashed before scoring any case (see the 'Run eval --profile ci' step's log, e.g. a missing DEEPSEEK_API_KEY secret)."
            exit 1
          fi
          echo "dir=$latest" >> "$GITHUB_OUTPUT"

      # Baseline = last successful main-branch run's report.json. Missing on
      # the very first run — that is not a failure (eval_baseline_compare.py
      # treats "no baseline" as pass).
      - name: Download baseline
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: eval.yml
          name: eval-baseline-ci
          branch: main
          path: baseline
          workflow_conclusion: success
          if_no_artifact_found: warn

      - name: Compare against baseline
        id: baseline_compare
        if: github.event_name == 'pull_request'
        run: |
          set +e
          uv run python scripts/eval_baseline_compare.py \
            --current "${{ steps.report.outputs.dir }}report.json" \
            --baseline baseline/report.json \
            --out baseline_diff.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = `${{ steps.report.outputs.dir }}report.md`;
            const diffPath = 'baseline_diff.md';
            const report = fs.existsSync(reportPath) ? fs.readFileSync(reportPath, 'utf8') : '(report.md missing)';
            const diff = fs.existsSync(diffPath) ? fs.readFileSync(diffPath, 'utf8') : '';
            const marker = '<!-- eval-report -->';
            const body = `${marker}\n## Eval report\n\n${report}\n\n### Baseline comparison\n\n${diff}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-${{ github.run_id }}
          path: ${{ steps.report.outputs.dir }}

      # Nightly/dispatch runs on main become the next baseline, win or lose —
      # a red main run should show up as red on the next PR diff too, not
      # get silently swallowed by re-comparing against an older green one.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: eval-baseline-ci
          path: ${{ steps.report.outputs.dir }}report.json
          retention-days: 90

      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

      - name: Fail on gate violations
        run: |
          exit_code="${{ steps.eval_run.outputs.exit_code }}"
          baseline_code="${{ steps.baseline_compare.outputs.exit_code }}"
          if [ "$exit_code" != "0" ]; then
            echo "eval.run reported blocking threshold violations (exit $exit_code)"
            exit 1
          fi
          if [ -n "$baseline_code" ] && [ "$baseline_code" != "0" ]; then
            echo "category regression vs main baseline (exit $baseline_code)"
            exit 1
          fi
