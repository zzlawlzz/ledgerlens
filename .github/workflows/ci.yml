# CI skeleton (T-006): lint -> unit (with postgres migrations) -> build.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # enables the manual smoke job below

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ledgerlens
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d ledgerlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ledgerlens
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ci-password
      POSTGRES_RO_PASSWORD: ci-ro-password
      GRAFANA_RO_PASSWORD: ci-grafana-ro-password
      EDGAR_USER_AGENT: "ledgerlens ci@example.com"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Schema reproducibility proof: migrations apply to a clean service container.
      - run: uv run alembic upgrade head
      # Re-run must be a no-op.
      - run: uv run alembic upgrade head
      - run: uv run pytest -m "not slow"
      # DB integration tests need only the postgres service — run them here too.
      - run: uv run pytest -m slow tests/integration/test_db.py

  build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t ledgerlens-app .

  # Manual (workflow_dispatch): live smoke against real EDGAR + DeepSeek.
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/" .env
          sed -i "s/^POSTGRES_RO_PASSWORD=.*/POSTGRES_RO_PASSWORD=ci-ro-password/" .env
          sed -i "s/^GRAFANA_RO_PASSWORD=.*/GRAFANA_RO_PASSWORD=ci-grafana-ro-password/" .env
          sed -i "s/^DEEPSEEK_API_KEY=.*/DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}/" .env
      - run: docker compose up -d --wait
      - run: uv run python scripts/smoke_test.py --auto-ingest
